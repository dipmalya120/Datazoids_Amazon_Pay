I/4YHeNxsj4S35bCCbW4IjX5xSEz05AMzgazMAXnIMEgnVTYjiUcd04FmUzbyMDIN9yK3h5w38VQcpe) format('woff2')}:root{--nav:#232F3E;--dk:#131A22;--org:#FF9900;--ord:#C45500;--bl:#146EB4;--tl:#007185;--bg:#EAEDED;--card:#FFFFFF;--bd:#D5D9D9;--tx:#0F1111;--mu:#565959;--red:#B12704;--grn:#067D62;--sand:#FFFFFF;--yel:#FEBD69;--lt:#FEBD69}
.sg,h1,h2,h3,.kpi .v,.brand,.kick,.bignum{font-family:'Space Grotesk',Inter,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:13.5px;line-height:1.45}
header{background:var(--dk);border-bottom:6px solid var(--org);color:#fff;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .brand{font-size:19px;font-weight:800}header .brand b{color:var(--org)}
header .sub{color:#d5dbe1;font-size:12.5px;flex:1;min-width:240px}header .team{font-size:11.5px;color:#d5dbe1;text-align:right}
nav{background:var(--nav);display:flex;gap:2px;padding:0 16px;overflow-x:auto;position:sticky;top:0;z-index:30;box-shadow:0 2px 6px #0003}
nav button{background:none;border:0;color:#e1e6ea;padding:10px 13px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button:hover{background:#2f3d4f;color:#fff}nav button.on{color:#fff;border-bottom-color:var(--org);background:#2f3d4f}
.fbar{background:var(--sand);border-bottom:1px solid var(--bd);padding:6px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:40px;z-index:25;font-size:12px}
.fbar label{color:var(--mu);font-weight:600;display:flex;align-items:center;gap:5px}
select,input[type=search]{font:inherit;font-size:12px;padding:3px 7px;border:1px solid #A6ABAB;border-radius:7px;background:#FFFFFF}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--org);outline-offset:1px}
.pill{background:var(--nav);color:#fff;border-radius:999px;padding:3px 11px;font-weight:700;font-size:11.5px}
.btn{background:linear-gradient(#FFE27A,#FFB21E);border:1px solid #C98200;border-radius:999px;padding:4px 13px;font:700 12px inherit;font-family:inherit;cursor:pointer;color:#111}
.btn.alt{background:#FFFFFF;border:1px solid #A6ABAB;font-weight:600}.btn:hover{filter:brightness(.96)}
main{max-width:1240px;margin:0 auto;padding:16px 22px 30px}
.tab{display:none}.tab.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
h1{font-size:22px;margin:2px 0 2px;color:var(--nav)}h2{font-size:15.5px;margin:0 0 4px;color:var(--nav)}h3{font-size:13.5px;margin:0 0 3px}
.lead{color:var(--mu);margin:0 0 10px;max-width:880px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g12{grid-template-columns:1.2fr 1fr}.g21{grid-template-columns:1fr 1.3fr}
@media(max-width:1000px){.g2,.g3,.g4,.g6,.g12,.g21{grid-template-columns:1fr 1fr}}@media(max-width:640px){.g2,.g3,.g4,.g6,.g12,.g21{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;min-width:0}
.card.top-n{border-top:6px solid var(--nav)}.card.top-t{border-top:6px solid var(--tl)}
.card.org{border-color:var(--org);background:var(--org);border-top:6px solid var(--ord)}.card.org h2,.card.org h3{color:#0F1111}.card.nv{background:var(--nav);color:#fff;border-color:var(--nav)}.card.nv h2{color:var(--org)}
.kpi{border-top:4px solid var(--org);padding:9px 12px}.kpi .v{font-size:23px;font-weight:800;color:var(--nav);white-space:nowrap}.kpi .l{color:var(--mu);font-size:11.5px;font-weight:700}.kpi .d{font-size:11px;color:var(--mu);margin-top:1px;line-height:1.3}
.hero{background:linear-gradient(110deg,var(--dk) 0%,var(--nav) 70%);color:#fff;border-radius:14px;padding:20px 24px;margin-bottom:12px;border-bottom:5px solid var(--org);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(#FF990055,transparent 70%)}
.hero h1{color:#fff;font-size:27px;margin:4px 0}.hero .by{color:#ffc766;font-weight:700;font-size:12.5px}.hero p{color:#d9dfe5;max-width:760px;margin:6px 0 0;font-size:13.5px}
.how{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.how span{background:#ffffff18;border:1px solid #ffffff30;border-radius:999px;padding:4px 12px;font-size:12px}.how b{color:var(--org)}
.ask{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.ask .q{background:var(--org);color:#111;font-weight:800;border-radius:9px;padding:3px 10px;font-size:16px}
.tryit{background:#FFF3DC;border:1px dashed #C98200;border-radius:9px;padding:6px 11px;font-size:12px;margin-bottom:10px}.tryit b{color:var(--ord)}
.take{background:#E4F1EA;border-left:4px solid var(--grn);padding:7px 11px;border-radius:7px;margin-top:8px;font-weight:600;font-size:12.5px}
.take.warn{background:#FFF0D1;border-color:var(--org)}.take.nv{background:#E3E9F0;border-color:var(--bl)}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:5px 0 5px 22px;position:relative;border-bottom:1px dotted var(--bd);font-size:12.5px}.ins li:last-child{border:0}.ins li:before{content:"▸";position:absolute;left:4px;color:var(--org);font-weight:800}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.ctl label{font-weight:600;color:var(--mu);font-size:12px;display:flex;gap:5px;align-items:center}
.sl{display:grid;grid-template-columns:140px 1fr 56px;gap:8px;align-items:center;margin:3px 0;font-size:12px}
input[type=range]{accent-color:var(--org);width:100%;height:14px}
.tw{border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;background:#FFFFFF}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:6px 10px;border-bottom:1px solid #E8EBEB;text-align:right}th:first-child,td:first-child{text-align:left}
th{background:var(--nav);color:#fff;font-weight:700;font-size:11.5px;border-bottom:3px solid var(--org);position:sticky;top:0}th.s{cursor:pointer}
tbody tr:nth-child(even) td{background:#F5F7F7}tbody tr:hover td{background:#FFF1D6}tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}td.b{font-weight:700}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
svg text{font-family:inherit;fill:var(--tx)}svg .mu{fill:var(--mu)}svg .ax{stroke:#C7CCCC}svg .gr{stroke:#E3E6E6}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .5s ease-out}@keyframes grow{from{transform:scaleY(0)}}
[data-tip]{cursor:pointer}[data-tip]:hover{filter:brightness(1.08)}
#tip{position:fixed;pointer-events:none;background:var(--dk);color:#fff;border-radius:8px;padding:7px 10px;font-size:11.5px;z-index:99;max-width:290px;display:none;box-shadow:0 3px 10px #0005}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin:4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.flow{display:flex;align-items:stretch;gap:0;margin:4px 0 10px;flex-wrap:wrap}
.step{flex:1;min-width:130px;background:var(--card);border:1.5px solid var(--bd);border-radius:11px;padding:8px 10px;cursor:pointer;position:relative;margin-right:22px}
.step:last-child{margin-right:0}.step:not(:last-child):after{content:"➜";position:absolute;right:-19px;top:50%;transform:translateY(-50%);color:var(--org);font-size:16px}
.step:hover{border-color:var(--org)}.step.on{border-color:var(--org);background:#FFF3DC;box-shadow:0 3px 0 var(--org)}
.step .n{background:var(--nav);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;margin-right:6px}.step.on .n{background:var(--org);color:#111}
.step .t{font-weight:700;font-size:12.5px}.step .s{font-size:11px;color:var(--mu);margin-top:3px}
.fc{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;margin:6px 0}
.nd{background:var(--nav);color:#fff;border-radius:10px;padding:7px 11px;text-align:center;font-size:12px;min-width:110px}.nd b{display:block;font-size:15px;color:var(--org)}.nd small{display:block;color:#cdd5dd;font-size:10.5px}
.nd.o{background:var(--org);color:#111}.nd.o b{color:#111}.nd.o small{color:#4a3a14}.nd.t{background:var(--tl)}.nd.t b{color:#fff}.nd.w{background:#FFFFFF;color:var(--tx);border:1.5px solid var(--bd)}.nd.w b{color:var(--nav)}.nd.w small{color:var(--mu)}
